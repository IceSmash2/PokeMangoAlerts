name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        default: "1.0.0"
      code:
        description: "Build number (raise by 1 for every release)"
        required: true
        default: "1"
      publish:
        description: "Publish a GitHub release (yes or no)"
        required: true
        default: "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add Firebase and signing files
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_B64" || { echo "Missing secret GOOGLE_SERVICES_B64"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "Missing secret KEYSTORE_B64"; exit 1; }
          echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.code }}
        run: gradle assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE" --stacktrace

      - name: Name the APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ls -l app/build/outputs/apk/release
          test -f app/build/outputs/apk/release/app-release.apk || { echo "The APK was not signed. Check the signing secrets."; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "PokeMangoAlerts-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PokeMangoAlerts-${{ inputs.version }}
          path: PokeMangoAlerts-${{ inputs.version }}.apk

      - name: Publish release
        if: ${{ inputs.publish == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PokéMango Alerts ${{ inputs.version }}
          files: PokeMangoAlerts-${{ inputs.version }}.apk
