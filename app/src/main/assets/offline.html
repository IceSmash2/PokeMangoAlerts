<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
body{margin:0;padding:24px 16px;background:#0b1030;color:#eef0fa;font:16px/1.5 system-ui,sans-serif}
.card{max-width:480px;margin:40px auto;padding:20px;background:#151c45;border:1px solid #2a3366;border-radius:16px}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#7b8cff;color:#0b1030;font:600 16px system-ui,sans-serif}
</style></head><body>
<div class="card"><h2>Can’t reach the server</h2>
<p>Check your connection. Alerts still arrive as notifications while the app is closed.</p>
<button onclick="AndroidApp.retry()">Try again</button></div>
</body></html>
